# Umlauter configuration
# Maps trigger sequences to accented characters.
# When you type a trigger sequence (e.g. "aee"), Umlauter will
# delete the typed characters and replace them with the accented letter.
#
# Matching is case-insensitive. If the first letter you type is uppercase,
# the replacement will be uppercase: aee -> ä, Aee -> Ä, AEE -> Ä
#
# Format: "trigger" = "replacement"
# Triggers should be lowercase.

[mappings]
aee = "ä"
oee = "ö"
uee = "ü"
sse = "ß"
